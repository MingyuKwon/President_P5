<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 대기실</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .player-list { margin: 20px 0; }
    .player-item { background:#16213e; border-radius:8px; padding:12px 18px; margin-bottom:8px;
      display:flex; justify-content:space-between; align-items:center; }
    .badge { font-size:0.75rem; background:#e94560; padding:2px 8px; border-radius:10px; }
    #room-id-display { font-size:0.85rem; color:#aaa; margin-bottom:16px; cursor:pointer; }
    #btn-start { width:100%; padding:14px; font-size:1.1rem; margin-top:12px; }
    #btn-leave { width:100%; margin-top:8px; background:#555; }
    #chat-wrap { margin-top:20px; display:flex; flex-direction:column; gap:0; border:1px solid #333; border-radius:10px; overflow:hidden; }
    #chat-title { background:#1a1a1a; padding:8px 14px; font-size:0.8rem; color:#aaa; border-bottom:1px solid #333; }
    #chat-messages {
      height:200px; overflow-y:auto; padding:8px 10px;
      display:flex; flex-direction:column; gap:6px; background:#111;
      scrollbar-width:thin; scrollbar-color:#444 transparent;
    }
    #chat-messages::-webkit-scrollbar { width:4px; }
    #chat-messages::-webkit-scrollbar-thumb { background:#444; border-radius:2px; }
    .chat-msg { display:flex; flex-direction:column; gap:2px; }
    .chat-msg .chat-nick { font-size:0.65rem; color:#aaa; }
    .chat-msg .chat-text { font-size:0.8rem; color:#eee; background:rgba(255,255,255,0.07); border-radius:6px; padding:4px 8px; word-break:break-all; line-height:1.4; }
    .chat-msg.mine .chat-nick { color:#e94560; }
    .chat-msg.mine { align-items:flex-end; }
    .chat-msg.mine .chat-text { background:rgba(233,69,96,0.2); }
    #chat-input-row { display:flex; gap:6px; padding:8px; background:#1a1a1a; border-top:1px solid #333; }
    #chat-input { flex:1; background:#111; border:1px solid #444; border-radius:6px; color:#eee; font-size:0.82rem; padding:6px 10px; outline:none; width:0; min-width:0; margin-bottom:0; }
    #chat-send { background:#e94560; border:none; border-radius:6px; color:#fff; font-size:0.8rem; padding:6px 14px; cursor:pointer; }
    #chat-send:hover { background:#c73652; }
  </style>
</head>
<body>
  <div class="container">
    <h1>대기실</h1>
    <div id="room-id-display"></div>
    <div class="player-list" id="player-list"></div>
    <button id="btn-start" disabled>게임 시작 (최소 3명)</button>
    <button id="btn-leave">나가기</button>
    <div id="chat-wrap">
      <div id="chat-title">채팅</div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="메시지 입력..." maxlength="100">
        <button id="chat-send">전송</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
