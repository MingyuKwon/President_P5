<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 대기실</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display:flex; }
    .container { flex:1; min-width:0; }
    .player-list { margin: 20px 0; }
    .player-item { background:#16213e; border-radius:8px; padding:12px 18px; margin-bottom:8px;
      display:flex; justify-content:space-between; align-items:center; }
    .badge { font-size:0.75rem; background:#e94560; padding:2px 8px; border-radius:10px; }
    #room-id-display { font-size:0.85rem; color:#aaa; margin-bottom:16px; cursor:pointer; }
    #btn-start { width:100%; padding:14px; font-size:1.1rem; margin-top:12px; }
    #btn-leave { width:100%; margin-top:8px; background:#555; }

    /* 우측 채팅 패널 */
    #chat-wrap {
      position:fixed; right:0; top:0; bottom:0; width:260px;
      display:flex; flex-direction:column;
      border-left:3px solid #fff; border-top:none; border-bottom:none; border-right:none;
      overflow:hidden;
    }
    #chat-title { background:#5a0a12; padding:8px 14px; font-size:0.85rem; color:#fff; font-weight:bold; letter-spacing:.05em; border-bottom:1px solid rgba(255,255,255,0.4); }
    #chat-messages {
      flex:1; overflow-y:auto; padding:8px 10px;
      display:flex; flex-direction:column; gap:9px;
      background:url('/Resource/UI/ChatBackground.jpg') center/cover no-repeat;
      scrollbar-width:thin; scrollbar-color:#aaa transparent;
    }
    #chat-messages::-webkit-scrollbar { width:4px; }
    #chat-messages::-webkit-scrollbar-thumb { background:#888; border-radius:2px; }
    .chat-msg { display:flex; flex-direction:column; gap:0; max-width:88%; align-self:flex-start; }
    .chat-msg .chat-nick { font-size:0.83rem; color:#000; background:none; border-radius:0; padding:1px 5px; display:inline-block; align-self:flex-start; position:relative; z-index:1; margin-bottom:-4px; -webkit-text-stroke:1px #dd0000; paint-order:stroke fill; }
    .chat-msg .chat-text { font-size:0.8rem; color:#000; background:#fff; border:none; border-radius:0; clip-path:polygon(0 0, 100% 0, 88% 100%, 0 100%); padding:6px 30px 4px 8px; word-break:break-all; line-height:1.4; filter:drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000); }
    .chat-msg.mine .chat-nick { color:#111; background:none; align-self:flex-end; border-radius:0; margin-bottom:-4px; }
    .chat-msg.mine { align-items:flex-end; align-self:flex-end; }
    .chat-msg.mine .chat-text { color:#fff; background:#000; clip-path:polygon(0 0, 100% 0, 100% 100%, 12% 100%); padding:6px 8px 4px 30px; filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff); }
    #chat-input-row { display:flex; gap:6px; padding:8px; background:rgba(0,0,0,0.4); border-top:1px solid rgba(255,255,255,0.5); }
    #chat-input { flex:1; background:#000; border:1px solid #fff; border-radius:0; color:#fff; font-size:0.82rem; padding:6px 10px; outline:none; width:0; min-width:0; margin-bottom:0; }
    #chat-input::placeholder { color:rgba(255,255,255,0.4); }
    #chat-send { background:#dd0000; border:1px solid #fff; border-radius:0; color:#fff; font-size:0.8rem; padding:6px 14px; cursor:pointer; }
    #chat-send:hover { background:#bb0000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>대기실</h1>
    <div id="room-id-display"></div>
    <div class="player-list" id="player-list"></div>
    <button id="btn-start" disabled>게임 시작 (최소 3명)</button>
    <button id="btn-leave">나가기</button>
  </div>

  <div id="chat-wrap">
    <div id="chat-title">채팅</div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="메시지 입력..." maxlength="100">
      <button id="chat-send">전송</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
