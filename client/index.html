<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div style="text-align:center; margin-bottom:24px;">
      <img src="/Resource/UI/Tycoon_Title.png" alt="대부호" style="max-width:100%; height:auto;">
    </div>

    <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="12">

    <div class="row">
      <button id="btn-refresh">새로고침</button>
      <button id="btn-create">방 만들기</button>
    </div>

    <div class="room-list" id="room-list">
      <p id="no-rooms">방이 없습니다.</p>
    </div>
  </div>

  <!-- 방 만들기 모달 -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <h2>방 만들기</h2>
      <input type="text" id="room-name" placeholder="방 이름 (최대 8명 참가 가능)" maxlength="20">
      <div class="row" style="margin-top:12px">
        <button id="btn-cancel">취소</button>
        <button id="btn-confirm-create">만들기</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
