<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 게임</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }
    #game-board { position:relative; width:100vw; height:100vh; background:#1e1e1e; }

    /* 플레이어 시트 */
    #player-seats { position:absolute; inset:0; pointer-events:none; }
    .player-seat {
      position:absolute;
      transform:translate(-50%, -50%);
      background:rgba(0,0,0,.65);
      border:2px solid rgba(255,255,255,.15);
      border-radius:12px;
      padding:8px 14px;
      text-align:center;
      min-width:80px;
    }
    /* 시트 프레임 이미지 — /Resource/UI/seat_frame.png 제공 시 자동 적용 */
    .seat-frame { position:absolute; inset:0; width:100%; height:100%;
      object-fit:fill; border-radius:12px; pointer-events:none; }
    .seat-frame[src=""] { display:none; }
    .seat-content { position:relative; z-index:1; }
    .player-seat.finished { opacity:.4; }
    @keyframes seat-glow {
      0%, 100% { border-color:#e94560; box-shadow:0 0 10px rgba(233,69,96,.6); background:rgba(233,69,96,.12); }
      50%       { border-color:#ff7a8a; box-shadow:0 0 24px rgba(233,69,96,.95); background:rgba(233,69,96,.25); }
    }
    .player-seat.active { animation:seat-glow 1.2s ease-in-out infinite; }
    .seat-name  { font-size:0.95rem; color:#fff; font-weight:bold; white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis; }
    .seat-cards { font-size:0.82rem; color:#aaa; margin-top:3px; }
    .seat-rank  { margin-top:4px; }
    .seat-rank img { height:18px; width:auto; vertical-align:middle; }
    .seat-rank img[src=""] { display:none; }

    /* 테이블 */
    #table { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      display:flex; gap:8px; min-width:200px; min-height:140px;
      align-items:center; justify-content:center; }
    .table-card { width:70px; height:100px; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .table-card img { width:100%; height:100%; object-fit:cover; }

    #revolution-badge { display:none; position:absolute; top:8px; right:16px;
      background:#e94560; padding:4px 12px; border-radius:10px; font-size:0.85rem; font-weight:bold; }
    #btn-exit { position:absolute; bottom:12px; right:14px;
      padding:4px 12px;
      background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.2); border-radius:8px;
      font-size:0.78rem; color:#aaa; cursor:pointer; }
    #btn-exit:hover { background:rgba(255,255,255,.1); color:#fff; }

    /* 내 손패 */
    #my-area { position:absolute; bottom:0; left:0; right:0; padding:16px;
      background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.1);
      transition:border-color .3s; }
    @keyframes my-area-glow {
      0%, 100% { border-color:#e94560; box-shadow:inset 0 0 20px rgba(233,69,96,.45); background:rgba(233,69,96,.1); }
      50%       { border-color:#ff7a8a; box-shadow:inset 0 0 36px rgba(233,69,96,.85); background:rgba(233,69,96,.22); }
    }
    #my-area.active { animation:my-area-glow 1.2s ease-in-out infinite; }
    #hand { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:110px; align-items:flex-end; }
    .hand-card { width:70px; height:100px; border-radius:8px; overflow:hidden;
      cursor:pointer; transition:transform .15s, box-shadow .15s; border:3px solid transparent;
      box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .hand-card:hover { transform:translateY(-8px); }
    .hand-card.selected { transform:translateY(-16px); border-color:#e94560; }
    .hand-card.dimmed { opacity:0.35; }
    .hand-card img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #action-btns { display:flex; gap:10px; justify-content:center; margin-top:10px; }
    /* 버튼 이미지 — /Resource/UI/btn_play.png, btn_pass.png 제공 시 자동 적용 */
    #action-btns button { padding:0; background:none; border:none; cursor:pointer; }
    #action-btns button:disabled { cursor:default; }
    #action-btns button img { display:block; height:48px; width:auto;
      transition:opacity .15s, transform .1s; }
    #action-btns button:disabled img { opacity:0.35; }
    #action-btns button:not(:disabled):hover img { transform:scale(1.05); }
    /* 이미지 없을 때 폴백 텍스트 (기본 숨김, onerror 시 표시) */
    #action-btns button span { display:none; padding:10px 28px;
      border-radius:6px; font-size:1rem; color:#fff; }
    #btn-play span { background:#e94560; }
    #btn-pass span { background:#555; }
    #action-btns button:disabled span { opacity:0.5; }
  </style>
</head>
<body>
  <div id="game-board">
    <div id="revolution-badge">혁명!</div>
    <div id="player-seats"></div>
    <div id="table"></div>

    <div id="my-area">
      <div id="hand"></div>
      <div id="action-btns">
        <button id="btn-play" disabled>
          <img src="/Resource/UI/btn_play.png" alt="카드 내기"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
          <span>카드 내기</span>
        </button>
        <button id="btn-pass" disabled>
          <img src="/Resource/UI/btn_pass.png" alt="패스"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
          <span>패스</span>
        </button>
      </div>
      <button id="btn-exit">나가기</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
