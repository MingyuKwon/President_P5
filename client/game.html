<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 게임</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; background:#000; }
    #game-board { position:fixed; width:1350px; height:900px; background:#1e1e1e; transform-origin:top left; overflow:hidden; }

    /* 플레이어 시트 */
    #player-seats { position:absolute; inset:0; pointer-events:none; }
    .player-seat {
      position:absolute;
      transform:translate(-50%, -50%);
      background:rgba(0,0,0,.65);
      border:2px solid rgba(255,255,255,.15);
      border-radius:12px;
      padding:8px 14px;
      text-align:center;
      min-width:80px;
    }
    /* 시트 프레임 이미지 — /Resource/UI/seat_frame.png 제공 시 자동 적용 */
    .seat-frame { position:absolute; inset:0; width:100%; height:100%;
      object-fit:fill; border-radius:12px; pointer-events:none; }
    .seat-frame[src=""] { display:none; }
    .seat-content { position:relative; z-index:1; }
    .player-seat.finished { opacity:.4; }
    @keyframes seat-glow {
      0%, 100% { border-color:#e94560; box-shadow:0 0 10px rgba(233,69,96,.6); background:rgba(233,69,96,.12); }
      50%       { border-color:#ff7a8a; box-shadow:0 0 24px rgba(233,69,96,.95); background:rgba(233,69,96,.25); }
    }
    .player-seat.active { animation:seat-glow 1.2s ease-in-out infinite; }
    .seat-name  { font-size:0.95rem; color:#fff; font-weight:bold; white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis; }
    .seat-cards { font-size:0.82rem; color:#aaa; margin-top:3px; }
    .seat-rank  { margin-top:4px; }
    .seat-rank img { height:18px; width:auto; vertical-align:middle; }
    .seat-rank img[src=""] { display:none; }

    /* 테이블 */
    #table { position:absolute; top:50%; left:50%; transform:translate(-50%, calc(-50% - 50px));
      width:460px; height:220px; }
    .table-group { position:absolute; top:50%; left:50%;
      display:flex; transform-origin:center; transition:opacity .2s; }
    .table-group:not(:last-child) { filter:brightness(0.35); }
    .table-group .table-card + .table-card { margin-left:-31px; }
    .table-card { width:100px; height:143px; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .table-card img { width:100%; height:100%; object-fit:cover; }

    #card-order-bar {
      position:absolute; top:10px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center;
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18);
      border-radius:20px; padding:5px 16px;
      font-size:1.05rem; white-space:nowrap; pointer-events:none;
      user-select:none;
    }
    .order-label { color:#888; font-size:0.75rem; margin-right:10px; letter-spacing:.03em; }
    .order-rank { padding:0 6px; font-weight:500; }
    .order-sep { color:#777; padding:0 2px; font-size:1rem; }
    .order-rev { margin-left:12px; background:#e94560; padding:2px 10px;
      border-radius:10px; font-size:0.8rem; font-weight:bold; color:#fff; }
    #turn-timer { font-size:1.1rem; font-weight:bold; color:#fff; background:rgba(0,0,0,.6);
      border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:4px 18px;
      pointer-events:none; white-space:nowrap; align-self:center;
      min-width:4.5em; text-align:center; }
    #turn-timer.urgent { color:#e94560; border-color:#e94560; }
    #btn-exit { position:absolute; top:0; right:14px; transform:translateY(calc(-100% - 8px));
      padding:4px 14px;
      background:rgba(0,0,0,.5); border:1.5px solid rgba(255,255,255,.7); border-radius:8px;
      font-size:0.78rem; color:#fff; cursor:pointer; }
    #btn-exit:hover { background:rgba(255,255,255,.15); border-color:#fff; }

    /* 내 손패 */
    #bottom-ui { position:absolute; bottom:0; left:0; right:0; display:flex; flex-direction:column; }
    #controls-row { position:relative; display:flex; justify-content:center; align-items:center; }
    #my-seat { position:absolute; left:300px; pointer-events:auto; }
    #my-area { position:relative; width:100%; padding:16px; }
    #hand { display:flex; flex-wrap:nowrap; justify-content:center; min-height:180px; align-items:flex-end; }
    .hand-card { width:106px; height:151px; border-radius:8px; overflow:hidden; position:relative;
      cursor:pointer; transition:transform .15s, box-shadow .15s; border:3px solid transparent;
      box-shadow:0 2px 8px rgba(0,0,0,.4); transform:translateY(calc(var(--drop,0px) + 25px)) rotate(var(--rot,0deg)); }
    .hand-card + .hand-card { margin-left:-32px; }
    .hand-card:hover { transform:translateY(calc(var(--drop,0px) + 25px - 12px)) rotate(var(--rot,0deg)); z-index:10; }
    .hand-card.selected { transform:translateY(calc(var(--drop,0px) + 25px - 20px)) rotate(var(--rot,0deg)); border-color:#e94560; z-index:5; }
    .hand-card.dimmed { filter:brightness(0.35); pointer-events:none; }
    .hand-card img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #action-btns { display:flex; flex-wrap:wrap; gap:32px; justify-content:center; }
    /* 버튼 이미지 — /Resource/UI/btn_play.png, btn_pass.png 제공 시 자동 적용 */
    .auto-mode #hand { pointer-events:none; opacity:0.5; }
    .auto-mode #btn-play, .auto-mode #btn-pass, .auto-mode #btn-autopass { pointer-events:none; opacity:0.3; }
    #action-btns button:not(#btn-autopass):not(#btn-auto) { padding:0; background:none; border:none; cursor:pointer; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):disabled { cursor:default; }
    #action-btns button:not(#btn-autopass):not(#btn-auto) img { display:block; height:48px; width:auto;
      transition:opacity .15s, transform .1s; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):disabled img { opacity:0.35; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):not(:disabled):hover img { transform:scale(1.05); }
    #autopass-row { width:100%; display:flex; justify-content:center; gap:50px; margin-top:8px; }
    #btn-autopass, #btn-auto { padding:5px 14px; border-radius:6px; font-size:0.72rem; font-weight:bold; cursor:pointer; transition:all .12s; }
    #btn-autopass { border:1.5px solid rgba(255,255,255,.3); background:rgba(255,255,255,.07); color:#888; box-shadow:0 3px 0 rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); transform:translateY(0); }
    #btn-autopass.on { border-color:#4caf50; background:rgba(76,175,80,.3); color:#4caf50; box-shadow:inset 0 2px 4px rgba(0,0,0,.4); transform:translateY(2px); }
    #btn-autopass:hover { filter:brightness(1.2); }
    #btn-auto { border:1.5px solid rgba(80,160,255,.8); background:rgba(80,160,255,.1); color:#ccc; box-shadow:0 3px 0 rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); transform:translateY(0); }
    #btn-auto.on { border-color:#50a0ff; background:rgba(80,160,255,.3); color:#ccc; box-shadow:inset 0 2px 4px rgba(0,0,0,.4); transform:translateY(2px); }
    #btn-auto:hover { filter:brightness(1.2); }
    /* 이미지 없을 때 폴백 텍스트 (기본 숨김, onerror 시 표시) */
    #action-btns button span { display:none; padding:10px 28px;
      border-radius:6px; font-size:1rem; color:#fff; }
    #btn-play span { background:#e94560; }
    #btn-pass span { background:#555; }
    #action-btns button:disabled span { opacity:0.5; }
  </style>
</head>
<body>
  <div id="game-board">
    <div id="card-order-bar"></div>
    <div id="player-seats"></div>
    <div id="table"></div>
    <div id="bottom-ui">
      <div id="controls-row">
        <div id="my-seat"></div>
        <div id="action-btns">
          <button id="btn-play" disabled>
            <img src="/Resource/UI/btn_play.png" alt="카드 내기"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
            <span>카드 내기</span>
          </button>
          <div id="turn-timer" style="visibility:hidden"></div>
          <button id="btn-pass" disabled>
            <img src="/Resource/UI/btn_pass.png" alt="패스"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
            <span>패스</span>
          </button>
          <div id="autopass-row">
            <button id="btn-autopass">자동 패스</button>
            <button id="btn-auto">자동</button>
          </div>
        </div>
      </div>
      <div id="my-area">
        <div id="hand"></div>
        <button id="btn-exit">나가기</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/ai-strategy.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
