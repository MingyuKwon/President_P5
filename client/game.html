<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 게임</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }
    #game-board { position:relative; width:100vw; height:100vh; background:#0f3460; }

    /* 플레이어 시트 */
    #player-seats { position:absolute; inset:0; pointer-events:none; }
    .player-seat {
      position:absolute;
      transform:translate(-50%, -50%);
      background:rgba(0,0,0,.65);
      border:2px solid rgba(255,255,255,.15);
      border-radius:12px;
      padding:8px 14px;
      text-align:center;
      min-width:80px;
    }
    .player-seat.me { border-color:rgba(255,255,255,.4); }
    .player-seat.finished { opacity:.4; }
    @keyframes seat-glow {
      0%, 100% { border-color:#e94560; box-shadow:0 0 10px rgba(233,69,96,.6); }
      50%       { border-color:#ff7a8a; box-shadow:0 0 24px rgba(233,69,96,.95); }
    }
    .player-seat.active { animation:seat-glow 1.2s ease-in-out infinite; }
    .seat-name  { font-size:0.82rem; color:#fff; font-weight:bold; white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis; }
    .seat-cards { font-size:0.72rem; color:#aaa; margin-top:3px; }
    .seat-rank  { font-size:0.7rem;  color:#f0a500; margin-top:2px; }

    /* 테이블 */
    #table { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      display:flex; gap:8px; min-width:200px; min-height:140px;
      align-items:center; justify-content:center; }
    .table-card { width:70px; height:100px; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .table-card img { width:100%; height:100%; object-fit:cover; }

#revolution-badge { display:none; position:absolute; top:8px; right:16px;
      background:#e94560; padding:4px 12px; border-radius:10px; font-size:0.85rem; font-weight:bold; }

    /* 내 손패 */
    #my-area { position:absolute; bottom:0; left:0; right:0; padding:16px;
      background:rgba(0,0,0,.6); border-top:2px solid rgba(255,255,255,.1);
      transition:border-color .3s; }
    @keyframes my-area-glow {
      0%, 100% { border-color:#e94560; box-shadow:0 -4px 16px rgba(233,69,96,.5); }
      50%       { border-color:#ff7a8a; box-shadow:0 -4px 28px rgba(233,69,96,.9); }
    }
    #my-area.active { animation:my-area-glow 1.2s ease-in-out infinite; }
    #my-info { display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px; padding:0 4px; }
    #my-name { font-size:0.88rem; color:#fff; font-weight:bold; }
    #my-rank { font-size:0.78rem; color:#f0a500; }
    #hand { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:110px; align-items:flex-end; }
    .hand-card { width:70px; height:100px; border-radius:8px; overflow:hidden;
      cursor:pointer; transition:transform .15s, box-shadow .15s; border:3px solid transparent;
      box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .hand-card:hover { transform:translateY(-8px); }
    .hand-card.selected { transform:translateY(-16px); border-color:#e94560; }
    .hand-card img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #action-btns { display:flex; gap:10px; justify-content:center; margin-top:10px; }
    #action-btns button { padding:10px 28px; font-size:1rem; min-width:120px; }
    #btn-pass { background:#555; }
  </style>
</head>
<body>
  <div id="game-board">
    <div id="revolution-badge">혁명!</div>
    <div id="player-seats"></div>
    <div id="table"></div>

    <div id="my-area">
      <div id="my-info">
        <span id="my-name"></span>
        <span id="my-rank"></span>
      </div>
      <div id="hand"></div>
      <div id="action-btns">
        <button id="btn-play" disabled>카드 내기</button>
        <button id="btn-pass" disabled>패스</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
