<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 게임</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; background:#000; }
    #game-board { position:fixed; width:1350px; height:900px; background:#1e1e1e; transform-origin:top left; overflow:hidden; }

    /* 플레이어 시트 */
    #player-seats { position:absolute; inset:0; pointer-events:none; }
    .player-seat {
      position:absolute;
      transform:translate(-50%, -50%);
      width:180px;
      text-align:center;
    }
    .seat-char {
      position:relative; transform:translateX(-25px);
    }
    .seat-char-shadow {
      display:block; width:100%; height:auto; pointer-events:none;
    }
    .seat-char-face {
      position:absolute; top:0; left:0; width:100%; height:auto;
      pointer-events:none;
    }
    .seat-overlay {
      position:absolute; top:80%; left:90%; transform:translate(-50%,-50%);
      width:110%; height:auto; pointer-events:none; z-index:5;
    }
    .seat-content {
      position:absolute; top:50%; left:0; right:0; z-index:2;
      transform:translateY(-50%); padding:4px 6px;
    }
    .player-seat.finished { opacity:.4; }
    .seat-name  { font-size:0.82rem; color:#fff; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 4px rgba(0,0,0,.9); }
    .seat-cards { font-size:0.72rem; color:#ccc; text-shadow:0 1px 4px rgba(0,0,0,.9); }

    /* 테이블 */
    #table { position:absolute; top:50%; left:50%; transform:translate(-50%, calc(-50% - 50px));
      width:460px; height:220px; }
    .table-group { position:absolute; top:50%; left:50%;
      display:flex; transform-origin:center; transition:opacity .2s; }
    .table-group:not(:last-child) { filter:brightness(0.35); }
    .table-group .table-card + .table-card { margin-left:-31px; }
    .table-card { width:100px; height:143px; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .table-card img { width:100%; height:100%; object-fit:cover; }

    #card-order-bar {
      position:absolute; top:10px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center;
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18);
      border-radius:20px; padding:5px 16px;
      font-size:1.05rem; white-space:nowrap; pointer-events:none;
      user-select:none;
    }
    .order-label { color:#888; font-size:0.75rem; margin-right:10px; letter-spacing:.03em; }
    .order-rank { padding:0 6px; font-weight:500; }
    .order-sep { color:#777; padding:0 2px; font-size:1rem; }
    @keyframes rev-heartbeat {
      0%,100% { transform:scale(1); }
      14%     { transform:scale(1.04); }
      28%     { transform:scale(1); }
      42%     { transform:scale(1.02); }
      70%     { transform:scale(1); }
    }
    #revolution-indicator { display:none; position:absolute; left:300px; bottom:calc(100% - 20px);
      transform:translateX(-50%); pointer-events:none; z-index:10; }
    #revolution-indicator img { height:99px; width:auto;
      animation:rev-heartbeat 1.2s ease-in-out infinite; }
    #turn-timer { position:relative; display:inline-flex; align-items:center; justify-content:center;
      pointer-events:none; align-self:center; }
    #turn-timer img { display:block; height:66px; width:auto; }
    #turn-timer .timer-text { position:absolute; font-size:1.15rem; font-weight:bold; color:#fff;
      text-shadow:0 1px 4px rgba(0,0,0,.9); }
    #turn-timer.urgent .timer-text { color:#e94560; }
    #btn-exit { position:absolute; bottom:10px; right:10px;
      padding:0; background:none; border:none; cursor:pointer; z-index:10; }
    #btn-exit img { display:block; height:56px; width:auto; transition:opacity .15s, transform .1s; }
    #btn-exit:hover img { transform:scale(1.05); opacity:0.85; }

    /* 내 손패 */
    #bottom-ui { position:absolute; bottom:-5px; left:0; right:0; display:flex; flex-direction:column; }
    #controls-row { position:relative; display:flex; justify-content:center; align-items:center; }
    #my-seat { position:absolute; left:300px; pointer-events:auto; }
    #my-area { position:relative; width:100%; padding:16px; }
    #hand { display:flex; flex-wrap:nowrap; justify-content:center; min-height:180px; align-items:flex-end; transform:translateX(-10px); }
    .hand-card { width:106px; height:151px; border-radius:8px; overflow:hidden; position:relative;
      cursor:pointer; transition:transform .15s, box-shadow .15s;
      box-shadow:0 2px 8px rgba(0,0,0,.4); transform:translateY(calc(var(--drop,0px) + 25px)) rotate(var(--rot,0deg)); }
    .hand-card + .hand-card { margin-left:-32px; }
    .hand-card:hover { transform:translateY(calc(var(--drop,0px) + 25px - 12px)) rotate(var(--rot,0deg)); z-index:10; }
    .hand-card.selected { transform:translateY(calc(var(--drop,0px) + 25px - 20px)) rotate(var(--rot,0deg)); z-index:5; }
    .hand-card.dimmed { filter:brightness(0.35); pointer-events:none; }
    .hand-card img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #action-btns { display:flex; flex-wrap:wrap; column-gap:27px; row-gap:8px; justify-content:center; transform:translateY(40px); }
    /* 버튼 이미지 — /Resource/UI/btn_play.png, btn_pass.png 제공 시 자동 적용 */
    .auto-mode #hand { pointer-events:none; opacity:0.5; }
    .auto-mode #btn-play, .auto-mode #btn-pass, .auto-mode #btn-autopass { pointer-events:none; opacity:0.3; }
    #auto-indicator {
      display:none; position:absolute; top:50%; left:50%;
      transform:translate(-50%, -50%);
      background:rgba(0,0,0,.8); border:1.5px solid #e94560;
      border-radius:24px; padding:10px 30px;
      color:#fff; font-size:1.1rem; font-weight:bold;
      pointer-events:none; white-space:nowrap; z-index:10;
      letter-spacing:.05em;
    }
    @keyframes auto-pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .auto-mode #auto-indicator { display:block; animation:auto-pulse 1.4s ease-in-out infinite; }
    #action-btns button:not(#btn-autopass):not(#btn-auto) { padding:0; background:none; border:none; cursor:pointer; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):disabled { cursor:default; }
    #action-btns button:not(#btn-autopass):not(#btn-auto) img { display:block; height:48px; width:auto;
      transition:opacity .15s, transform .1s; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):disabled img { opacity:0.35; }
    #action-btns button:not(#btn-autopass):not(#btn-auto):not(:disabled):hover img { transform:scale(1.05); }
    #autopass-row { position:absolute; bottom:95px; right:10px; display:flex; flex-direction:column; align-items:flex-end; gap:14px; z-index:20; }
    #btn-autopass, #btn-auto { padding:0; background:none; border:none; cursor:pointer; }
    #btn-autopass img, #btn-auto img { display:block; height:68px; width:auto; transition:transform .12s, filter .15s; }
    #btn-autopass.on img, #btn-auto.on img { filter: sepia(1) saturate(6) hue-rotate(310deg); }
    #btn-autopass:hover img, #btn-auto:hover img { transform:scale(1.05); }

    /* 게임 종료 오버레이 */
    #game-over-overlay {
      display:none; position:absolute; inset:0;
      background:rgba(0,0,0,.5); z-index:100;
      justify-content:center; align-items:center;
    }
    #game-over-overlay.open { display:flex; }
    #game-over-content {
      position:relative;
      display:flex; flex-direction:column; align-items:center; gap:28px;
    }
    #game-over-ranks {
      display:flex; gap:40px; align-items:center; justify-content:center;
    }
    .go-player-card {
      position:relative; width:156px;
      filter:drop-shadow(0 6px 18px rgba(0,0,0,.7));
    }
    .go-player-card img.go-card-dark {
      width:100%; height:auto; display:block; position:relative; z-index:3;
      transform:translateX(20px) translateY(100px) rotate(0deg) scale(1);
      opacity:.92;
    }
    .go-card-reward-bg {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:100%; height:auto; z-index:2;
    }
    .go-card-bg {
      position:absolute; top:calc(50% + 30px); left:50%; transform:translate(-50%,-50%);
      width:170%; height:auto; z-index:1;
    }
    .go-card-badge {
      position:absolute; top:-10px; left:20px;
      height:101px; width:auto; z-index:4;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    }
    .go-card-content {
      position:absolute; top:40%; left:0; right:0; bottom:8%;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      padding:0 6px; gap:6px;
    }
    .go-card-name { font-size:1rem; font-weight:bold; color:#fff;
      text-align:center; word-break:break-all; line-height:1.2; }
    #btn-to-room { padding:11px 36px; font-size:1rem; border-radius:8px; }

    /* 이미지 없을 때 폴백 텍스트 (기본 숨김, onerror 시 표시) */
    #action-btns button span { display:none; padding:10px 28px;
      border-radius:6px; font-size:1rem; color:#fff; }
    #btn-play span { background:#e94560; }
    #btn-pass span { background:#555; }
    #action-btns button:disabled span { opacity:0.5; }
  </style>
</head>
<body>
  <div id="game-board">
    <button id="btn-exit"><img src="/Resource/UI/ControlPanel/Exit.png" alt="나가기"></button>
    <div id="autopass-row">
      <button id="btn-autopass"><img src="/Resource/UI/ControlPanel/AutoPass.png" alt="자동 패스"></button>
      <button id="btn-auto"><img src="/Resource/UI/ControlPanel/Auto.png" alt="자동"></button>
    </div>
    <div id="game-over-overlay">
      <div id="game-over-content">
        <div id="game-over-ranks"></div>
        <button id="btn-to-room">대기실로 돌아가기</button>
      </div>
    </div>
    <div id="card-order-bar"></div>
    <div id="player-seats"></div>
    <div id="table"></div>
    <div id="bottom-ui">
      <div id="controls-row">
        <div id="my-seat"></div>
        <div id="revolution-indicator"><img src="/Resource/UI/game-state/Revolution.png" alt="혁명"></div>
        <div id="action-btns">
          <button id="btn-play" disabled>
            <img src="/Resource/UI/ControlPanel/CardSelect.png" alt="카드 내기"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
            <span>카드 내기</span>
          </button>
          <div id="turn-timer" style="visibility:hidden">
            <img src="/Resource/UI/ControlPanel/Time.png" alt="">
            <span class="timer-text"></span>
          </div>
          <button id="btn-pass" disabled>
            <img src="/Resource/UI/ControlPanel/Pass.png" alt="패스"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
            <span>패스</span>
          </button>
        </div>
      </div>
      <div id="my-area">
        <div id="auto-indicator">⚡ 자동 진행 중</div>
        <div id="hand"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/ai-strategy.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
