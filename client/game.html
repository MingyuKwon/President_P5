<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대부호 - 게임</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }
    #game-board { position:relative; width:100vw; height:100vh; background:#0f3460; }

    /* 턴 순서 패널 (왼쪽) */
    #turn-panel { position:absolute; top:16px; left:16px;
      width:max-content; max-width:240px;
      max-height:calc(100vh - 220px); overflow-y:auto;
      background:rgba(0,0,0,.5); border-radius:12px; padding:12px; }
    #turn-panel h3 { font-size:0.8rem; color:#aaa; margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; }
    .turn-row { display:flex; align-items:center; gap:8px; padding:6px 8px;
      border-radius:8px; margin-bottom:4px; transition:background .2s; }
    .turn-row.active { background:rgba(233,69,96,.25); border:1px solid #e94560; }
    .turn-row.finished { opacity:0.35; }
    .turn-row.me { font-weight:bold; }
    .turn-num { font-size:0.75rem; color:#888; min-width:16px; }
    .turn-name { flex:1; font-size:0.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .turn-cards { font-size:0.8rem; color:#aaa; white-space:nowrap; }
    .turn-arrow { font-size:0.8rem; color:#e94560; }

    /* 테이블 */
    #table { position:absolute; top:50%; left:calc(50% + 80px); transform:translate(-50%,-50%);
      display:flex; gap:8px; min-width:200px; min-height:140px;
      align-items:center; justify-content:center; }
    .table-card { width:70px; height:100px; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .table-card img { width:100%; height:100%; object-fit:cover; }

    /* 상태 표시 */
    #status-bar { position:absolute; top:calc(50% + 80px); left:calc(50% + 80px);
      transform:translateX(-50%); color:#fff; font-size:1rem; text-align:center; white-space:nowrap; }
    #revolution-badge { display:none; position:absolute; top:8px; right:16px;
      background:#e94560; padding:4px 12px; border-radius:10px; font-size:0.85rem; font-weight:bold; }

    /* 내 손패 */
    #my-area { position:absolute; bottom:0; left:0; right:0; padding:16px;
      background:rgba(0,0,0,.6); }
    #my-info { display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.9rem; color:#aaa; }
    #hand { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:110px; align-items:flex-end; }
    .hand-card { width:70px; height:100px; border-radius:8px; overflow:hidden;
      cursor:pointer; transition:transform .15s; border:3px solid transparent;
      box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .hand-card:hover { transform:translateY(-8px); }
    .hand-card.selected { transform:translateY(-16px); border-color:#e94560; }
    .hand-card img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #action-btns { display:flex; gap:10px; justify-content:center; margin-top:10px; }
    #action-btns button { padding:10px 28px; font-size:1rem; min-width:120px; }
    #btn-pass { background:#555; }
  </style>
</head>
<body>
  <div id="game-board">
    <div id="revolution-badge">혁명!</div>

    <!-- 턴 순서 패널 -->
    <div id="turn-panel">
      <h3>턴 순서</h3>
      <div id="turn-list"></div>
    </div>

    <div id="table"></div>
    <div id="status-bar">대기중...</div>

    <div id="my-area">
      <div id="my-info">
        <span id="my-nickname"></span>
        <span id="my-rank"></span>
      </div>
      <div id="hand"></div>
      <div id="action-btns">
        <button id="btn-play" disabled>카드 내기</button>
        <button id="btn-pass" disabled>패스</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
